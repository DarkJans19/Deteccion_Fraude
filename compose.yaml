services:
  app:
    build:
      context: .
      target: api
    image: deteccion-fraude:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ${MONGODB_ENV_FILE:-./.env}
        format: raw
    environment:
      MONGODB_ENV_RAW: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:${APP_PORT:-8765},127.0.0.1:${APP_PORT:-8765},localhost:8765,127.0.0.1:8765}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:${APP_PORT:-8765},http://127.0.0.1:${APP_PORT:-8765}}
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8765"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  qr:
    build:
      context: .
      target: qr
    image: deteccion-fraude-qr:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ${MONGODB_ENV_FILE:-./.env}
        format: raw
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      OCR_LANG: spa+eng
    ports:
      - "127.0.0.1:${QR_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  telegram:
    profiles: [telegram]
    build:
      context: .
      target: telegram
    image: deteccion-fraude-telegram:local
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ANALYSIS_API_URL: http://qr:8000/api/analizar
      TELEGRAM_IMAGE_API_URL: http://qr:8000/api/analizar-imagen
      ANALYSIS_API_TIMEOUT: ${ANALYSIS_API_TIMEOUT:-120}
      IMAGE_MAX_MB: ${IMAGE_MAX_MB:-10}
    depends_on:
      qr:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

