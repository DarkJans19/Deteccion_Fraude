services:
  app:
    build:
      context: .
      target: api
    image: deteccion-fraude:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ${MONGODB_ENV_FILE:-./.env}
        format: raw
    environment:
      MONGODB_ENV_RAW: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:${APP_PORT:-8765},127.0.0.1:${APP_PORT:-8765},localhost:8765,127.0.0.1:8765}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:${APP_PORT:-8765},http://127.0.0.1:${APP_PORT:-8765}}
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8765"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  qr:
    build:
      context: .
      target: qr
    image: deteccion-fraude-qr:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ${MONGODB_ENV_FILE:-./.env}
        format: raw
    ports:
      - "127.0.0.1:${QR_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  telegram:
    profiles: [telegram]
    build:
      context: .
      target: telegram
    image: deteccion-fraude-telegram:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ${MONGODB_ENV_FILE:-./.env}
        format: raw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  whatsapp:
    profiles: [whatsapp]
    build:
      context: .
      target: whatsapp
    image: deteccion-fraude-whatsapp:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ${MONGODB_ENV_FILE:-./.env}
        format: raw
    environment:
      WHATSAPP_ANALYSIS_API_URL: ${WHATSAPP_ANALYSIS_API_URL:-http://host.docker.internal:8000/api/analizar}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
    shm_size: 512mb
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  whatsapp_auth:
  whatsapp_cache:
